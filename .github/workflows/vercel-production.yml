name: Vercel production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

env:
  MONGODB_URI: mongodb://127.0.0.1:27017/skybridge-cluster
  PRISMA_DATABASE_URL: mongodb://127.0.0.1:27017/skybridge-cluster
  NEXTAUTH_URL: http://localhost:3000
  NEXTAUTH_SECRET: ci-only-secret-do-not-use-in-production
  OPENAI_API_KEY: ci-not-used

jobs:
  verify:
    name: Verify main before deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Run test suite
        run: npm run test:all

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit --incremental false

      - name: Production build
        run: npm run build

  deploy:
    name: Deploy production
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@41.7.1

      - name: Link Vercel project metadata
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Pull production environment
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build Vercel artifact
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy production artifact
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
